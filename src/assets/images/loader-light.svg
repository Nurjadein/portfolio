<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Light Mode -->
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.25" />
    </filter>

    <!-- Center Pulse Glow -->
    <filter id="centerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Gradient Circle -->
    <linearGradient id="vibrantCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Rotating Accent Gradient -->
    <linearGradient id="vividAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Center Square Gradient -->
    <linearGradient id="contrastSquareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Track Base Ring -->
  <circle cx="250" cy="250" r="142" fill="none" stroke="#cbd5e1" stroke-width="12" />

  <!-- Main Background Glowing Circle -->
  <circle cx="250" cy="250" r="128" fill="url(#vibrantCircleGrad)" filter="url(#lightShadow)" />

  <!-- Animated Progress Arc (Rotates Continuously) -->
  <path d="M 250 108 A 142 142 0 0 1 392 250" fill="none" stroke="url(#vividAccentGrad)" stroke-width="12" stroke-linecap="round">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 250 250" 
      to="360 250 250" 
      dur="1.2s" 
      repeatCount="indefinite" />
  </path>

  <!-- Pulse Animated Center Square -->
  <rect x="200" y="200" width="100" height="100" rx="24" fill="url(#contrastSquareGrad)" filter="url(#centerGlow)">
    <animate 
      attributeName="transform" 
      type="scale" 
      values="1; 1.06; 1" 
      keyTimes="0; 0.5; 1" 
      dur="2s" 
      repeatCount="indefinite" 
      transform-origin="250 250" />
  </rect>
</svg>
